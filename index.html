<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A short narrative arcade game about the Taiwanese garbage truck. Gamedev.js Jam 2026 entry." />
    <meta name="theme-color" content="#0a0a0f" />
    <title>When the Machine Sings</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a0f;
        color: #e8dccb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at center, #14101c 0%, #050508 75%);
      }
      canvas {
        display: block;
        image-rendering: auto;
        max-width: 100%;
        max-height: 100%;
        box-shadow: 0 0 60px rgba(232, 185, 106, 0.08);
      }
      #loading-fallback {
        color: #e8dccb;
        font-family: serif;
        font-style: italic;
        text-align: center;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="loading-fallback">Loading the dusk...</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
